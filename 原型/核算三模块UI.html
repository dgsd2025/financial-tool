<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>核算与看板 UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#16202B;--indigo:#2B5CE6;--seal:#C8352B;--jade:#10796B;--amber:#B4700E;
  --bg:#FAFBFC;--surface:#FFFFFF;--surface-2:#F1F4F7;--surface-3:#E7ECF1;
  --text:var(--ink);--text-2:#5B6B7C;--text-3:#8695A4;
  --border:#DDE4EA;--border-2:#C8D2DB;--bar:#1B2733;--bar-text:#9DAFBE;
  --accent:var(--indigo);--accent-soft:#E8EEFD;--good:var(--jade);--good-soft:#E2F1EE;
  --warn:var(--amber);--warn-soft:#FBF0DC;--crit:var(--seal);--crit-soft:#FBE8E6;
  --shadow:0 1px 2px rgba(22,32,43,.06),0 4px 12px rgba(22,32,43,.05);
  --f-body:"Noto Sans SC",-apple-system,"PingFang SC",sans-serif;
  --f-mono:"IBM Plex Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101922;--surface:#16212C;--surface-2:#1D2A37;--surface-3:#25343F;
  --text:#E6EDF3;--text-2:#9BAAB8;--text-3:#71818F;--border:#26343F;--border-2:#33444F;
  --bar:#0B1219;--accent:#7CA0F5;--accent-soft:#1B2942;--good:#4FBFA9;--good-soft:#122E2B;
  --warn:#DFA33F;--warn-soft:#33280F;--crit:#E5766B;--crit-soft:#3A1C19;
}}
:root[data-theme="dark"]{
  --bg:#101922;--surface:#16212C;--surface-2:#1D2A37;--surface-3:#25343F;
  --text:#E6EDF3;--text-2:#9BAAB8;--text-3:#71818F;--border:#26343F;--border-2:#33444F;
  --bar:#0B1219;--accent:#7CA0F5;--accent-soft:#1B2942;--good:#4FBFA9;--good-soft:#122E2B;
  --warn:#DFA33F;--warn-soft:#33280F;--crit:#E5766B;--crit-soft:#3A1C19;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.bar1{display:flex;align-items:center;gap:10px;background:var(--bar);padding:0 16px;height:46px;position:sticky;top:0;z-index:40}
.bar1 .logo{width:26px;height:26px;border-radius:6px;background:var(--indigo);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.bar1 .t{font-size:13.5px;color:#fff;font-weight:500}
.bar1 .t i{font-style:normal;font-family:var(--f-mono);font-size:9.5px;color:#637585;margin-left:8px}
.bar1 .sp{flex:1}
.ibtn{background:rgba(255,255,255,.08);border:none;color:var(--bar-text);border-radius:6px;cursor:pointer;padding:5px 10px;font-size:12px;font-family:inherit}
.ibtn:hover{background:rgba(255,255,255,.15);color:#fff}
.bar2{display:flex;gap:2px;background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;position:sticky;top:46px;z-index:35;overflow-x:auto}
.bar2 button{background:none;border:none;border-bottom:2px solid transparent;color:var(--text-2);font-family:inherit;font-size:12.5px;padding:10px 12px 8px;cursor:pointer;white-space:nowrap}
.bar2 button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.bar2 .gp{color:var(--text-3);font-size:10.5px;padding:12px 8px 8px;font-family:var(--f-mono);white-space:nowrap}
.wrap{padding:18px 16px 70px;max-width:1560px}
.phead{display:flex;align-items:flex-start;gap:14px;margin-bottom:13px;flex-wrap:wrap}
.phead h2{font-size:18px}
.phead .s{color:var(--text-2);font-size:12.5px;margin-top:3px;max-width:84ch}
.phead .mid{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.mcode{font-family:var(--f-mono);font-size:10.5px;color:var(--text-3);border:1px solid var(--border);border-radius:4px;padding:2px 6px}
.btn{font-family:inherit;font-size:12px;border-radius:6px;padding:5px 12px;cursor:pointer;border:1px solid var(--border-2);background:var(--surface);color:var(--text)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:3px 9px;font-size:11.5px}
.sel{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:3px 9px;font-size:11.5px;color:var(--text-2)}
.sel b{color:var(--text);font-weight:500}
.sel::after{content:"▾";color:var(--text-3);font-size:9px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;margin-bottom:13px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.kpi.g::before{background:var(--good)}.kpi.w::before{background:var(--warn)}.kpi.c::before{background:var(--crit)}
.kpi .k{font-size:11px;color:var(--text-2)}
.kpi .v{font-family:var(--f-mono);font-size:19px;font-weight:600;margin-top:2px}
.kpi .v small{font-size:11px;font-weight:400;color:var(--text-3);margin-left:2px}
.kpi.c .v{color:var(--crit)}.kpi.w .v{color:var(--warn)}.kpi.g .v{color:var(--good)}
.kpi .d{font-size:10.5px;color:var(--text-3);margin-top:1px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.card>.ch{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--border);background:var(--surface-2);flex-wrap:wrap}
.card>.ch h3{font-size:13px}
.card>.ch .sp{flex:1}
.card>.cb{padding:13px}
.card>.cb.flush{padding:0}
.cols{display:grid;gap:12px}.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}
.c21{grid-template-columns:1.6fr 1fr}
@media (max-width:1020px){.c2,.c3,.c21{grid-template-columns:1fr}}
.tw{overflow:auto;max-height:70vh}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:5px 9px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
thead th{background:var(--surface-2);font-weight:500;font-size:10.5px;color:var(--text-2);letter-spacing:.04em;position:sticky;top:0;z-index:2}
thead th.grp{text-align:center;border-bottom:1px solid var(--border-2);background:var(--surface-3)}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tfoot td{background:var(--surface-2);font-weight:600;border-top:2px solid var(--border-2)}
tr.lv1 td:first-child{font-weight:600}
tr.lv2 td:first-child{padding-left:26px}
tr.lv3 td:first-child{padding-left:44px;color:var(--text-2)}
tr.sum td{background:var(--surface-2);font-weight:600}
.red{color:var(--crit);font-weight:500}.grn{color:var(--good)}.mut{color:var(--text-3)}
.pill{display:inline-flex;border-radius:20px;padding:1px 8px;font-size:10.5px;font-weight:500;white-space:nowrap}
.p-ok{background:var(--good-soft);color:var(--good)}.p-wa{background:var(--warn-soft);color:var(--warn)}
.p-cr{background:var(--crit-soft);color:var(--crit)}.p-in{background:var(--accent-soft);color:var(--accent)}
.p-mu{background:var(--surface-3);color:var(--text-2)}
.code{font-family:var(--f-mono);font-size:11px;background:var(--surface-3);border-radius:3px;padding:1px 5px;color:var(--text-2)}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:9px 13px;border-radius:0 7px 7px 0;font-size:12.5px;margin-bottom:12px}
.note.c{border-left-color:var(--crit);background:var(--crit-soft)}
.note.w{border-left-color:var(--warn);background:var(--warn-soft)}
.note.g{border-left-color:var(--good);background:var(--good-soft)}
.note b{font-weight:700}
.chain{display:flex;align-items:center;gap:0;overflow-x:auto;margin:6px 0 14px}
.cn{flex:1;min-width:120px;background:var(--surface-2);border:1px solid var(--border);padding:9px 11px}
.cn:first-child{border-radius:7px 0 0 7px}.cn:last-child{border-radius:0 7px 7px 0}
.cn+.cn{border-left:none}
.cn .t2{font-size:12.5px;font-weight:500}
.cn .d2{font-size:10.5px;color:var(--text-2);margin-top:2px}
.cn.done{background:var(--good-soft);border-color:var(--good)}
.cn.now{background:var(--accent-soft);border-color:var(--accent)}
.field{margin-bottom:9px}
.field label{font-size:11px;color:var(--text-2);display:block;margin-bottom:3px}
.field .inp{border:1px solid var(--border-2);border-radius:5px;padding:5px 9px;background:var(--surface-2);font-size:12px;min-height:29px;display:flex;align-items:center}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:820px){.f3{grid-template-columns:1fr 1fr}}
.rptgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.rpt{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:9px;padding:12px 13px;cursor:pointer;text-align:left;font-family:inherit;color:var(--text)}
.rpt:hover{box-shadow:var(--shadow);border-color:var(--accent)}
.rpt .n{font-size:13.5px;font-weight:500}
.rpt .d{font-size:11.5px;color:var(--text-2);margin-top:3px;line-height:1.5}
.rpt .m{font-family:var(--f-mono);font-size:10px;color:var(--text-3);margin-top:6px}
/* 看板 */
.bcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:10px}
.bc{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 13px;box-shadow:var(--shadow);border-top:3px solid var(--accent);cursor:pointer;text-align:left;font-family:inherit;color:var(--text)}
.bc:hover{box-shadow:0 4px 16px rgba(22,32,43,.12)}
.bc.g{border-top-color:var(--good)}.bc.w{border-top-color:var(--warn)}.bc.c{border-top-color:var(--crit)}
.bc .en{font-size:13px;font-weight:600}
.bc .sub3{font-size:10.5px;color:var(--text-3);margin-top:1px}
.bc .big{font-family:var(--f-mono);font-size:21px;font-weight:600;margin:7px 0 2px}
.bc .row2{display:flex;justify-content:space-between;font-size:11px;color:var(--text-2);margin-top:3px}
.bc .row2 b{font-family:var(--f-mono);font-weight:600;color:var(--text)}
.spark{display:flex;align-items:flex-end;gap:2px;height:26px;margin-top:8px}
.spark i{flex:1;background:var(--accent-soft);border-radius:1px 1px 0 0;min-height:2px}
.spark i.hi{background:var(--accent)}
.bar-h{display:flex;align-items:center;gap:8px;margin:5px 0}
.bar-h .lb{width:96px;font-size:11.5px;color:var(--text-2);flex:none}
.bar-h .tr{flex:1;height:16px;background:var(--surface-3);border-radius:3px;overflow:hidden;position:relative}
.bar-h .tr i{display:block;height:100%;background:var(--accent)}
.bar-h .tr i.g{background:var(--good)}.bar-h .tr i.c{background:var(--crit)}
.bar-h .vv{width:92px;text-align:right;font-family:var(--f-mono);font-size:11.5px;flex:none}
.alerts{display:flex;flex-direction:column;gap:6px}
.al{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border-radius:7px;background:var(--surface-2);border-left:3px solid var(--warn);font-size:12px}
.al.c{border-left-color:var(--crit);background:var(--crit-soft)}
.al .ai{font-size:13px;flex:none}
.al b{font-weight:600}
button:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="bar1">
  <span class="logo">财</span>
  <span class="t">核算与经营看板 · UI 设计<i>待确认 · 未开发</i></span>
  <span class="sp"></span>
  <span class="sel">主体 <b>优栖（广州）服务管理</b></span>
  <span class="sel">期间 <b>2026-08</b></span>
  <button class="ibtn" id="themeBtn">◐</button>
</div>
<div class="bar2" id="nav"></div>
<div class="wrap" id="view"></div>

<script>
const H=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const M=n=>(Number(n)||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const pill=(t,k)=>`<span class="pill p-${k}">${H(t)}</span>`;
const kpis=a=>`<div class="kpis">${a.map(k=>`<div class="kpi ${k.t||''}"><div class="k">${H(k.k)}</div><div class="v">${k.v}${k.u?`<small>${H(k.u)}</small>`:''}</div>${k.d?`<div class="d">${H(k.d)}</div>`:''}</div>`).join('')}</div>`;
const table=(c,r,f,head2)=>`<div class="tw"><table>${head2||''}<thead><tr>${c.map(x=>`<th class="${x.n?'num':''}" ${x.cs?`colspan="${x.cs}"`:''}>${H(x.t)}</th>`).join('')}</tr></thead><tbody>${r.map(row=>Array.isArray(row)?`<tr>${row.map((x,i)=>`<td class="${c[i]&&c[i].n?'num':''}">${x}</td>`).join('')}</tr>`:`<tr class="${row.cls||''}">${row.d.map((x,i)=>`<td class="${c[i]&&c[i].n?'num':''}">${x}</td>`).join('')}</tr>`).join('')}</tbody>${f?`<tfoot><tr>${f.map((x,i)=>`<td class="${c[i]&&c[i].n?'num':''}">${x}</td>`).join('')}</tr></tfoot>`:''}</table></div>`;
const card=(t,b,tools)=>`<div class="card"><div class="ch"><h3>${H(t)}</h3><span class="sp"></span>${tools||''}</div><div class="cb flush">${b}</div></div>`;
const cardp=(t,b,tools)=>`<div class="card"><div class="ch"><h3>${H(t)}</h3><span class="sp"></span>${tools||''}</div><div class="cb">${b}</div></div>`;
const head=(t,s,code,tools)=>`<div class="phead"><div><h2>${H(t)}</h2><div class="s">${s}</div></div><div class="mid">${code?`<span class="mcode">${H(code)}</span>`:''}${tools||''}</div></div>`;

const S={};

/* ══════ 总览 ══════ */
S.plan=()=>head('三个模块的依赖链','凭证已经能生成了，所以这条链现在通得起来。<b>顺序不能乱</b>——后面每一环都吃前面的产出。','设计说明')
+`<div class="chain">
  <div class="cn done"><div class="t2">① 凭证</div><div class="d2">T2 已上线<br>工具箱产出</div></div>
  <div class="cn now"><div class="t2">② 账簿</div><div class="d2">科目余额表<br>明细账 · 总分类账</div></div>
  <div class="cn now"><div class="t2">③ 固定资产</div><div class="d2">卡片 · 折旧摊销<br>回写凭证</div></div>
  <div class="cn now"><div class="t2">④ 报表中心</div><div class="d2">资产负债 · 利润<br>现金流量 · 费用明细</div></div>
</div>`
+`<div class="note"><b>为什么是这个顺序：</b>账簿是把凭证按科目重新组织；报表是把账簿按格式重新汇总。
  固定资产夹在中间——它<b>产生凭证</b>（每月折旧），所以必须在报表之前完成，否则报表里的累计折旧和费用是缺的。</div>`
+`<div class="cols c3">
  ${cardp('② 账簿','<div style="font-size:12.5px;line-height:1.9">'
    +'<b>科目余额表</b>　期初/本期/累计/期末，四组借贷<br>'
    +'<b>明细账</b>　三栏式，按科目逐笔<br>'
    +'<b>总分类账</b>　按月汇总，一级科目<br><br>'
    +'<span class="mut">全部从凭证实时汇总，不单独存储</span></div>')}
  ${cardp('③ 固定资产','<div style="font-size:12.5px;line-height:1.9">'
    +'<b>资产卡片</b>　原值/使用月份/残值率/净值<br>'
    +'<b>折旧计提</b>　按月生成，可回写凭证<br>'
    +'<b>资产变动</b>　增加/减少/调拨<br>'
    +'<b>折旧明细表</b>　按部门/科目汇总<br><br>'
    +'<span class="mut">摊销与折旧同一套机制</span></div>')}
  ${cardp('④ 报表中心','<div style="font-size:12.5px;line-height:1.9">'
    +'<b>资产负债表</b>　年初 vs 期末<br>'
    +'<b>利润表</b>　本期 vs 本年累计<br>'
    +'<b>现金流量表</b>　经营/投资/筹资<br>'
    +'<b>费用明细表</b>　按科目×部门×项目<br><br>'
    +'<span class="mut">全部按公开准则模板</span></div>')}
</div>`
+`<div class="note w"><b>一个前提要先说清楚：</b>账簿和报表的数只有在<b>凭证齐全</b>时才可信。
  当前 T2 只处理银行流水，<b>不含计提、结转、摊销这类无现金流的凭证</b>。
  所以初期账簿能对，但利润表和资产负债表会缺计提部分——这一点会在报表页明确标出来，不装作完整。</div>`;

/* ══════ 账簿 ══════ */
S.bal=()=>head('科目余额表','按公开模板：期初余额、本期发生额、本年累计、期末余额四组借贷。','账簿',
 `<span class="sel">级次 <b>2 级</b></span><span class="sel">期间 <b>2026-08</b></span>
  <button class="btn">显示无发生额科目</button><button class="btn pri">导出</button>`)
+kpis([
  {k:'期初借贷平衡',v:'✓',t:'g'},{k:'本期借方合计',v:'328,455.03'},
  {k:'本期贷方合计',v:'328,455.03'},{k:'期末借贷平衡',v:'✓',t:'g'},
  {k:'含未过账凭证',v:'14',u:'张',t:'w',d:'可切换是否包含'},
])
+card('科目余额表 · 2026年8月',table(
 [{t:'科目编码'},{t:'科目名称'},{t:'期初借方',n:1},{t:'期初贷方',n:1},{t:'本期借方',n:1},{t:'本期贷方',n:1},
  {t:'本年借方',n:1},{t:'本年贷方',n:1},{t:'期末借方',n:1},{t:'期末贷方',n:1}],
 [
  {cls:'lv1',d:['<span class="code">1002</span>','银行存款',M(486200),'',M(146538.5),M(178993.5),M(1284000),M(982340),M(453745),'']},
  {cls:'lv2',d:['<span class="code">100201</span>','张华工行7239','',' ',M(1450),'','','',M(1450),'']},
  {cls:'lv2',d:['<span class="code">100202</span>','张华工行9999',M(386200),'',M(131542.5),M(164237.5),'','',M(353505),'']},
  {cls:'lv2',d:['<span class="code">100203</span>','优栖工行6418',M(100000),'',M(13546),M(14756),'','',M(98790),'']},
  {cls:'lv1',d:['<span class="code">1122</span>','应收账款',M(224680),'','',M(111246.2),M(680400),M(455720),M(113433.8),'']},

   ['风险标记','T1 红线 + 月结检查单','各自规则'],
   ['趋势条','总分类账逐月','明细账'],
 ]))}
 ${cardp('不做的三件事',table([{t:'不做'},{t:'为什么'}],[
   ['看板单独存一份汇总数','两份数必然对不上，且没人知道该信哪份'],
   ['凭证不全时给"预估值"','预估值会被当成真实经营结果讨论'],
   ['为了好看做同比环比','数据只有 8 个月且口径变过，同比无意义'],
 ]))}
</div>`;

const NAV=[
 ['plan','总览'],['—经营看板'],['dash','经营看板'],['drill','下钻路径'],['—账簿'],['bal','科目余额表'],['detail','明细账'],['gl','总分类账'],
 ['—固定资产'],['fa','资产卡片'],['facard','卡片详情'],['dep','折旧计提'],['dept','折旧明细表'],
 ['—报表中心'],['rpt','报表首页'],['bs','资产负债表'],['pl','利润表'],['cf','现金流量表'],['exp','费用明细表'],
];
let cur='plan';
function render(){
  document.getElementById('nav').innerHTML=NAV.map(x=>
    x.length===1?`<span class="gp">${x[0]}</span>`
    :`<button data-s="${x[0]}" class="${x[0]===cur?'on':''}">${x[1]}</button>`).join('');
  document.getElementById('view').innerHTML=S[cur]();
  window.scrollTo({top:0,behavior:'instant'});
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(b){cur=b.dataset.s;render();}});
document.getElementById('themeBtn').addEventListener('click',()=>{
  const r=document.documentElement,c=r.getAttribute('data-theme');
  const sys=matchMedia('(prefers-color-scheme: dark)').matches;
  r.setAttribute('data-theme',(c||(sys?'dark':'light'))==='dark'?'light':'dark');
});
render();
</script>
